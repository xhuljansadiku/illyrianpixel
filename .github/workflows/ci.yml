name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Kap gabimet që dalin vetëm gjatë build-it (tipet e faqeve, generateStaticParams,
      # Server/Client Components). Vlerat janë placeholder — build-i s'ka nevojë për sekrete reale.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          ADMIN_PASSWORD: ci
          ADMIN_SESSION_SECRET: ci
          CRON_SECRET: ci
      - run: node scripts/check-static.mjs
