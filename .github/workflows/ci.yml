name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # The build needs no secrets: without RESEND_* the contact API simply
      # reports that e-mail delivery is not configured.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.example.com
      - run: npm run check:static
